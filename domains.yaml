# ---------------------------------------------------------------------------
# Domain Registry
# ---------------------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for data domains, subject areas,
# and ownership. It is intentionally separated from Terraform infrastructure
# variables so that domain owners and data stewards can update it without
# needing to understand HCL or touch any .tf file.
#
# HOW TO USE:
#   - Add a domain:   copy an existing block, change the keys, open a PR
#   - Add a subject:  add an entry under subject_areas in the domain, open a PR
#   - Update an owner: change the email field(s), open a PR
#   - Remove a domain: delete the block AND coordinate decommission (see DOMAIN_MANAGEMENT.md)
#
# After any change: CI runs `terraform plan` for review, then `terraform apply` on merge.
#
# OWNERSHIP FIELDS:
#   owner.email         Primary contact – shown on Azure tags and Unity Catalog properties.
#                       Should be a team alias, not an individual, so ownership survives rotation.
#   owner.escalation    Manager or director-level contact for escalation.
#   owner.teams_channel Teams channel for fast incident routing.
#                       Format: "Team Name/Channel Name"
#                       Example: "Data Platform/Finance" means the Finance channel
#                       inside the Data Platform team.
#
# NETWORK:
#   address_space     /16 CIDR. Must not overlap hub (10.0.x.x), ADB VNet (10.1.x.x),
#                     or any other domain. Allocated at domain creation; never change after first apply.
#
# ACCESS (Entra group Object IDs):
#   owners_group      Full control over the catalog and storage.
#   engineers_group   Create/write to all schemas and external locations.
#   viewers_group     Read-only SELECT on published data.
# ---------------------------------------------------------------------------

